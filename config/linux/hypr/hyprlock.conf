# BACKGROUND
background {
    monitor =
    path = ~/Pictures/wallpapers/hyprland.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgba(cdd6f4ee)
    font_size = 90
    font_family = Iosevka Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgba(cdd6f4ee)
    font_size = 40
    font_family = Iosevka Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %H:%M -")</span>"
    color = rgba(cdd6f4ee)
    font_size = 20
    font_family = Iosevka Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = cmd[update:60000] bash -c 'h=$(date +%H); if [ "$h" -lt 6 ]; then echo "Good Night, Richard"; elif [ "$h" -lt 12 ]; then echo "Good Morning, Richard"; elif [ "$h" -lt 18 ]; then echo "Good Afternoon, Richard"; else echo "Good Evening, Richard"; fi'
    color = rgba(cdd6f4ee)
    font_size = 22
    font_family = Iosevka Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

