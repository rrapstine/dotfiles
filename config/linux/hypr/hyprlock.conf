# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(cba6f7, 0.8)
    inner_color = rgba(31324480)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    placeholder_text = <i><span foreground="##6c708699">Enter Password</span></i>
    hide_input = false
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    position = 0, -210
    halign = center
    valign = center
}

# Suspend
label {
    monitor =
    text = ⏾
    color = rgba(cba6f799)
    font_size = 75
    onclick = systemctl suspend
    position = -150, 180
    halign = center
    valign = bottom
}

# Reboot
label {
    monitor =
    text = ↻
    color = rgba(cba6f799)
    font_size = 75
    onclick = systemctl reboot
    position = 0, 180
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = ⏻
    color = rgba(cba6f799)
    font_size = 75
    onclick = systemctl poweroff
    position = 150, 180
    halign = center
    valign = bottom
}
